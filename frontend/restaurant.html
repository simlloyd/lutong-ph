<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | LutongPH</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- NAVBAR -->
     <nav class="navbar">
        <a href="index.html" class="nav-logo">🍔 LutongPH</a>
        <div class="nav-links">
            <span id="nav-user"></span>
            <a href="auth.html" id="nav-auth">Login</a>
            <a href="cart.html" id="nav-cart">🛒 Cart</a>
            <a href="orders.html" id="nav-orders">My Orders</a>
            <a href="#" id="nav-logout" onclick="logout()">Logout</a>
        </div>
     </nav>

     <!-- RESTAURANT HEADER -->
      <div id="restaurant-header"></div>

      <!-- MENU SECTION -->
       <section class="section">
        <h2 class="section-title">Menu</h2>
        <div class="menu-grid" id="menu-grid">
            <p class="message">Loading menu...</p>
        </div>
       </section>

       <script src="js/api.js"></script>
       <script src="js/app.js"></script>
       <script>
        const params = new URLSearchParams(window.location.search);
        const restaurantId = params.get('id');

        if (!restaurantId) {
            window.location.href = 'index.html';
        }

        async function loadRestaurant() {
            const restaurant = await getRestaurantById(restaurantId);
            const header = document.getElementById('restaurant-header');

            header.innerHTML = `
            <div style="background: linear-gradient(135deg, #e63946, #f4a261); padding: 40px; color: #fff;">
                <div style="max-width: 800px; margin: 0 auto;">
                    <a href="index.html" style="color: #fff; opacity: 0.8; font-size: 0.9rem;">← Back to restaurant</a>
                    <h1 style="font-size: 2rem; margin: 12px 0;">${restaurant.name}</h1>
                    <p>${restaurant.cuisine} • ${restaurant.address}</p>
                    <p>📞 ${restaurant.phone}</p>
                    <p style="margin-top: 8px">
                        <span style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px;">
                            Delivery fee: ₱${restaurant.deliveryFee}
                            <span>
                        <span style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; margin-left: 8px;">
                            ${restaurant.isOpen ? '🟢 Open' : '🔴 Closed'}
                            </span>
                        </p>
                    </div>
                </div> 
                `;
        }

        async function loadMenu() {
            const menuItems = await getMenuItems(restaurantId);
            const grid = document.getElementById('menu-grid');

            if (menuItems.length === 0) {
                grid.innerHTML = '<p class="message">No menu items yet.</p>';
                return;
            }

            grid.innerHTML = menuItems.map(item => `
            <div class="menu-card">
                <div class="menu-card-img">
                    ${item.image
                    ? `<img src="${item.image}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;" />`
                    : '🍽️'
                    }
                    </div>
                    <div class="menu-card-body">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        <div class="menu-card-footer">
                            <span class="menu-price">₱${item.price}</span>
                            ${item.isAvailable
                            ? `<button class="btn" style="padding:8px 16px; font-size:0.85rem;"
                            onclick="handleAddToCart('${item._id}')">Add to Cart</button>`
                        : `<span style="color:#999; font-size:0.85rem;">Not available</span>`
                        }
                        </div>
                        </div>
                        </div>
                         `).join(''); 
                    }

                    async function handleAddToCart(menuItemId) {
                        if (!isLoggedIn()) {
                            alert('Please login to add items to cart!');
                            window.location.href = 'auth.html';
                            return;
                        }

                        const data = await addToCart(menuItemId, 1);

                        if (data.conflict) {
                            const confirm = window.confirm(
                                'Your cart has item from another restaurant. Clear cart and add this item?'
                            );
                            if (confirm) {
                                await clearCart();
                                await addToCart(menuItemId, 1);
                                alert('Added to cart!');
                                window.location.href = 'cart.html';
                            }
                            return;
                        }

                        if (data.items) {
                            alert('Added to cart! 🛒');
                            window.location.href = 'cart.html';
                        } else {
                            alert(data.message);
                        }
                    }

                    loadRestaurant();
                    loadMenu();
       </script>
    
</body>
</html>
