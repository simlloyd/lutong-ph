<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LutongPH - Food Delivery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    
    <!-- NAVBAR -->
     <nav class="navbar">
        <a href="index.html" class="nav-logo" >🍔 LutongPH</a>
        <div class="nav-links">
            <span id="nav-user"></span>
            <a href="auth.html" id="nav-auth">Login</a>
            <a href="cart.html" id="nav-cart">🛒 Cart</a>
            <a href="orders.html" id="nav-orders">My Orders</a>
            <a href="#" id="nav-logout" onclick="logout()">Logout</a>
        </div>
     </nav>

     <!-- HERO -->
      <section class="hero">
        <h1>🍔 LutongPH</h1>
        <p>Order food from your favorite local restaurants!</p>
        <a href="#restaurants" class="btn">Browse Restaurants</a>
      </section>

      <!-- RESTAURANTS -->
       <section class="section" id="restaurants">
        <h2 class="section-title">Restaurants Near you</h2>
        <div class="restaurants-grid" id="restaurants-grid">
            <p class="message">Loading restaurants...</p>
        </div>
       </section>

       <script src="js/api.js"></script>
       <script src="js/app.js"></script>
       <script>
        async function loadRestaurants() {
            const restaurants = await getRestaurants();
            const grid = document.getElementById('restaurants-grid');

            if (restaurants.length === 0) {
                grid.innerHTML = '<p> class="message">No restaurants available yet.</p>';
                return;
            }

            grid.innerHTML = restaurants.map(restaurant => `
            <div class="restaurant-card" onclick="window.location.href='restaurant.html?id=${restaurant._id}'">
                <div class="restaurant--card-img">
                    ${restaurant.image
                        ? `<img src="${restaurant.image}" alt="${restaurant.name}" style="width:100%;height:100%;object-fit:cover;" />`
                    : '🍽️' 
                    }
                    </div>
                    <div class="restaurant-card-body">
                        <h3>${restaurant.name}
                            <span class="restaurant-status ${restaurant.isOpen ? 'status-open' : 'status-closed'}'>
                                ${restaurant.isOpen ? '● Open' : '● Closed'}
                                </span>
                            </h3>
                            <p>${restaurant.address}</p>
                            <p>Delivery fee: ₱${restaurant.deliveryFee}</p>
                            <span class="restaurant-tag">${restaurant.cuisine}</span>
                            </div>
                        </div>
                        `).join('');
        }

        loadRestaurants();
       </script>
</body>
</html>
